name: Plan sign-off
description: Thursday 24 September, in class. Filled in by the instructor at the team's table, from the team's docs/plan.md.
title: "Project 1 plan sign-off"
labels: ["plan sign-off"]
body:
  - type: markdown
    attributes:
      value: |
        Filled in by the instructor during Thursday's class, from the team's `docs/plan.md` draft.
        Nothing here is graded. Each team is visited at its table and the plan is either signed off
        or given the one thing to fix before any code is written.
  - type: input
    attributes:
      label: Team members present
    validations:
      required: true
  - type: input
    attributes:
      label: The game, and what is the team's own about it
    validations:
      required: true
  - type: input
    attributes:
      label: The algorithm, and the second one it is measured against
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: The plan
      description: Tick what the draft of plan.md says, not what the team says at the table.
      options:
        - label: "The game is the team's own: invented, or extended from a game that exists with at least one rule, board, piece or goal that differs and changes what the search sees."
        - label: "The mover matches the algorithm: something else takes turns, so minimax or alpha-beta; or only the agent moves, so a frontier search (breadth first, depth first, iterative deepening, uniform cost, A*)."
        - label: "If the puzzle is scored on the fewest moves, plan.md names which of the two searches guarantees a shortest solution."
        - label: "No hidden information and no dice: fully observable and deterministic."
        - label: "A state is a whole position plus whose turn it is, and two move orders that reach the same position give the same state."
        - label: "The size estimate is a number, and the team can say where it came from."
        - label: "If the full tree does not finish, a depth limit and an evaluation function are named, and the team knows the answer at the horizon is an estimate."
        - label: "The second algorithm runs on the same interface from the same starting state, so the node counts compare."
        - label: "Goal 2 in plan.md is the node count measurement, stated so reflection.md can say whether it was met."
        - label: "Every line of play ends, and every turn has a real choice."
        - label: "The team can play one full game of it by hand, on paper."
  - type: dropdown
    attributes:
      label: Outcome
      options:
        - "Signed off"
        - "Signed off after the fix below"
        - "Not yet: a new plan is needed"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Fix before writing code
      description: The one thing to change, if there is one.
  - type: textarea
    attributes:
      label: Notes
